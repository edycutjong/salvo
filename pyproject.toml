[project]
name = "salvo"
version = "1.3.0"
description = "Salvo — brief in, N scored ad variants out, best three ship. Batch creative factory on Genblaze + Backblaze B2."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edy Cu" }]
dependencies = [
    # Sponsor spine. Umbrella pin brings genblaze-core (+ genblaze-s3). The OFFLINE
    # path relies only on genblaze-core (MockProvider / SyncProvider extension point).
    "genblaze==0.4.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "httpx>=0.28.1",
    # Security floor for a transitive dep (via pyasn1-modules): pyasn1 < 0.6.4 has
    # three HIGH DoS advisories. Pin the floor to force the patched release.
    "pyasn1>=0.6.4",
]

[project.optional-dependencies]
# Real-mode provider bundles (needs credentials + budget). Not installed in CI or OFFLINE.
providers = [
    "genblaze[image,openai]==0.4.1",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "salvo"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    # Starlette 1.x nudges toward httpx2; FastAPI's TestClient emits this
    # UserWarning-based deprecation on import. Third-party + harmless offline.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

# ── Automatic semantic versioning (python-semantic-release) ──────────────────
# CI runs `semantic-release version` on green main pushes: it reads Conventional
# Commit messages since the last tag, bumps the version in BOTH the pyproject and
# the package __version__, writes CHANGELOG.md, commits `chore(release): …`,
# tags `vX.Y.Z`, and cuts a GitHub Release. `feat:` → minor · `fix:`/`perf:` →
# patch · `feat!:`/`BREAKING CHANGE:` → major. No relevant commits → no bump.
[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["salvo/__init__.py:__version__"]
build_command = ""                        # deployed via Railway, not published to PyPI
commit_message = "chore(release): v{version} [skip ci]"
allow_zero_version = true                 # stay in 0.x until a deliberate 1.0.0

[tool.semantic_release.branches.main]
match = "main"

[tool.uv]
override-dependencies = ["pillow>=12.3.0"]
