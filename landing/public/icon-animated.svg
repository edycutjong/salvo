<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Salvo animated icon: variant tiles pop in, the chosen one is ringed in magenta and checked">
  <!-- Standalone: no text, no fonts, zero external refs · SMIL + CSS · 6s loop. -->
  <defs>
    <linearGradient id="svb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="0.55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="svp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="svd" cx="0.25" cy="0.15" r="1.15">
      <stop offset="0" stop-color="#1B1630"/><stop offset="1" stop-color="#08070F"/>
    </radialGradient>
    <filter id="svg1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .tp { transform-box: fill-box; transform-origin: center; opacity: 0; animation: tp 6s cubic-bezier(.2,1.4,.4,1) infinite; }
      @keyframes tp { 0% { opacity:0; transform: scale(.5);} 3% { opacity:1; transform: scale(1.12);} 5%,96% { opacity:1; transform: scale(1);} 100% { opacity:0;} }
      .c1 { animation-delay: .18s; } .c2 { animation-delay: .42s; } .c3 { animation-delay: .66s; }
      .big { animation-delay: 1.0s; }
      .ringpulse { transform-box: fill-box; transform-origin: center; animation: rp 6s ease-in-out infinite; }
      @keyframes rp { 0%,55% { opacity:0;} 62%,80% { opacity:.5;} 92%,100% { opacity:0;} }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- Tile -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#svd)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="rgba(167,158,203,0.22)" stroke-width="3"/>

  <!-- Candidates pop in (staggered volley) -->
  <g class="tp c1"><rect x="112" y="112" width="128" height="128" rx="28" fill="url(#svb)" opacity="0.45"/></g>
  <g class="tp c2"><rect x="272" y="112" width="128" height="128" rx="28" fill="url(#svb)" opacity="0.7"/></g>
  <g class="tp c3"><rect x="112" y="272" width="128" height="128" rx="28" fill="url(#svb)" opacity="0.55"/></g>

  <!-- The pick lands -->
  <g class="tp big"><rect x="264" y="264" width="144" height="144" rx="32" fill="url(#svb)"/></g>

  <!-- Pick ring draws itself -->
  <rect x="252" y="252" width="168" height="168" rx="40" fill="none" stroke="url(#svp)" stroke-width="16"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.24;0.42;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <!-- ring glow pulse after the draw -->
  <rect class="ringpulse" x="252" y="252" width="168" height="168" rx="40" fill="none" stroke="#EC4899" stroke-width="16" filter="url(#svg1)"/>

  <!-- Check draws -->
  <path d="M 306 338 L 330 362 L 372 314" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.44;0.56;1" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>
