<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Salvo icon: a grid of variants with the chosen one ringed">
  <defs>
    <linearGradient id="vf-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--primary-strong, #A78BFA)"/>
      <stop offset="0.55" stop-color="var(--primary, #8B5CF6)"/>
      <stop offset="1" stop-color="var(--primary-deep, #6D28D9)"/>
    </linearGradient>
    <linearGradient id="vf-pick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--accent-strong, #F472B6)"/>
      <stop offset="1" stop-color="var(--accent, #EC4899)"/>
    </linearGradient>
    <radialGradient id="vf-depth" cx="0.25" cy="0.15" r="1.15">
      <stop offset="0" stop-color="#1B1630"/>
      <stop offset="1" stop-color="var(--bg-0, #08070F)"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#vf-depth)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none"
        stroke="rgba(167,158,203,0.22)" stroke-width="3"/>

  <!-- Variant grid (2×2). Three candidates… -->
  <rect x="112" y="112" width="128" height="128" rx="28" fill="url(#vf-brand)" opacity="0.45"/>
  <rect x="272" y="112" width="128" height="128" rx="28" fill="url(#vf-brand)" opacity="0.7"/>
  <rect x="112" y="272" width="128" height="128" rx="28" fill="url(#vf-brand)" opacity="0.55"/>

  <!-- …and the chosen one: raised, ringed, checked -->
  <rect x="264" y="264" width="144" height="144" rx="32" fill="url(#vf-brand)"/>
  <rect x="252" y="252" width="168" height="168" rx="40" fill="none"
        stroke="url(#vf-pick)" stroke-width="16"/>
  <path d="M 306 338 L 330 362 L 372 314" fill="none"
        stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
